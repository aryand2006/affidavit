[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "affidavit"
version = "0.1.0"
description = "A research-governance gate that swears whether a strategy result survives falsification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aryan Daga", email = "aryand@andrew.cmu.edu" }]
keywords = [
  "backtesting",
  "quantitative-finance",
  "overfitting",
  "look-ahead-bias",
  "research-governance",
  "selection-bias",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
affidavit = "affidavit.cli:main"
sworn = "affidavit.cli:main"

[project.urls]
Source = "https://github.com/aryand2006/affidavit"

[tool.setuptools.packages.find]
include = ["affidavit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
